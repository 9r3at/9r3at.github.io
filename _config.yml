        sub_title: AI Engineer, AI솔루션본부 Data플랫폼팀
        caption: 2023.07 - 현재
        quote: >
          금융 도메인 지식그래프와 LLM 서빙 인프라를 기획부터 운영까지 직접 설계·구축
        description: | # this will include new lines to allow paragraphs
          **Knowledge Graph DB with Ontology**

          RDB와 비정형 금융문서(공시·투자설명서·리서치)를 통합 Knowledge Graph로 변환하는 Ingestion 파이프라인을 설계·구현. PDF 표/그림 파싱 정확도를 높이기 위해 PDF 글리프 좌표 기반 표 복원 로직을 개발했고, LLM이 생성한 온톨로지(TBox)를 법령·공식분류체계 기준으로 검증하는 Self-Reflective 평가 루프를 구축해 수작업 검수 없이도 품질을 보장. 오픈소스 Temporal Graph 엔진을 자체 구현으로 대체해 시간축 기반 사실 모순 탐지(Bi-temporal invalidation)를 지원.

          - RDB·비정형 문서(DART 공시, 간이투자설명서, 리서치, 하우스뷰)를 입력으로 받아 Knowledge Graph(Neptune)/Vector Index(OpenSearch)를 구축하는 Ingestion 5단계 파이프라인(parsing/ontology/ontology_axioms/materialization/indexing) 개발
          - PDF 테이블 파싱 정확도 문제를 OCR 결과와 PDF 원본 글리프·괘선 좌표를 교차검증하는 알고리즘(band detection + DP alignment + VLM patch)으로 해결
          - 법령·공식분류체계(자본시장법, KRX, DART)를 LLM 비의존 ETL로 추출해 온톨로지 설계 LLM의 가드레일(폐쇄분류체계·스코프상한)로 제공, SHACL 검증 및 버전 간 breaking-change 자동 분류 구현
          - LLM 셀프평가 기반 재추출 루프를 도입해 온톨로지 품질을 자동 개선(임계값 미달 시 피드백 주입 후 재생성, 초과 시 Human escalation)

          **AIOps 플랫폼 & LLM 최적화 서빙**

          - Kubernetes기반의 플랫폼, 분석계 저장소 CDP(Hadoop)과 연계된 데이터 분석 환경과 LLM을 제공하는 플랫폼
          - 무중단(region 간 failover·링크 단절 내성·GPU 장애 자동 격리)과 LLM 성능(prefix cache 라우팅·P/D 분리·KV 관리)을 동시에 고려한 대고객 LLM 서빙 플랫폼을 설계하고, 인증·테넌트 quota·모델 alias·감사·데이터 region 정책을 담당하는 LLM Gateway를 LiteLLM/Envoy/AIBrix 기반으로 구현

