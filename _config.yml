content_en:
  - title: Experience
    layout: list
    content:
      - layout: left
        title: Mirae Asset Securities
        sub_title: AI Engineer, AI Solutions Division
        caption: Jul 2023 – Present
        quote: >
          Designing and operating financial-domain knowledge graphs and LLM serving infrastructure end to end
        description: | # this will include new lines to allow paragraphs
          **Ontology-Based Knowledge Graph**

          Designed and built an ingestion pipeline that converts RDB records and unstructured financial documents — including disclosures, prospectuses, and research reports — into a unified knowledge graph. Developed a table reconstruction method based on glyph coordinates and rule-line geometry to improve PDF table and figure parsing accuracy, and built a self-evaluation loop that validates LLM-generated ontologies (TBox) against statutes and official classification systems. Replaced an open-source temporal graph engine with a custom implementation supporting bi-temporal invalidation to detect contradictions between facts over time.

          - Built a five-stage ingestion pipeline — parsing, ontology generation, ontology axioms, materialization, and indexing — that processes RDB records and unstructured documents, including DART disclosures, simplified prospectuses, research reports, and house views, and populates both a knowledge graph in Amazon Neptune and a vector index in OpenSearch.
          - Improved PDF table parsing accuracy by developing an algorithm that cross-validates OCR output against glyph coordinates and rule-line geometry extracted from the original PDF, using band detection, DP alignment, and VLM-based patching.
          - Extracted statutes and official classification systems — including the Financial Investment Services and Capital Markets Act, KRX classifications, and DART taxonomies — through an LLM-independent ETL pipeline and used them as guardrails for ontology generation, including closed classifications and scope constraints. Added SHACL-based validation and automatic classification of breaking changes across ontology versions.
          - Introduced an LLM self-evaluation and re-extraction loop that automatically improves ontology quality by regenerating results with injected feedback when quality falls below a defined threshold, with human review triggered only when automated recovery is insufficient.

          **AIOps Platform & LLM Serving Optimization**

          - Operated a Kubernetes-based AI platform providing data analysis environments integrated with a CDP/Hadoop analytics warehouse, along with access to internally hosted LLMs.
          - Designed a customer-facing LLM serving architecture that balances high availability — including cross-region failover, link-failure tolerance, and automatic GPU fault isolation — with inference performance through prefix-cache routing, prefill/decode disaggregation, and KV-cache management.
          - Built an LLM Gateway using LiteLLM, Envoy, and AIBrix to manage authentication, tenant quotas, model aliases, audit logging, and data-region policies.

