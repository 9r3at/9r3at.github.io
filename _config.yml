content_en:
  - title: Experience
    layout: list
    content:
      - layout: left
        title: Mirae Asset Securities
        sub_title: AI Engineer, Data Platform Team, AI Solutions Division
        caption: Jul 2023 - Present
        quote: >
          Designing and building financial-domain knowledge graphs and LLM serving infrastructure end to end, from planning to operations
        description: | # this will include new lines to allow paragraphs
          **Knowledge Graph DB with Ontology**

          Designed an ontology and knowledge graph for securities products, PB guides, and WM work guides, and planned and built a KG generation pipeline covering structured and unstructured data. Implemented LLM-based information extraction from unstructured documents, with separate pipelines per document type. Extended beyond the limits of vector-search-based RAG, which struggles with relational and structural queries, by building a KG-based RAG. Modeled internal work processes (WM, PB) as an ontology, laying the foundation for agents to drive real workflow efficiency.

          - Hallucination: Applying an LLM without domain understanding to unstructured data caused relational errors and reduced reliability. Proposed improvements including VL-model-based embeddings, a reranker, and a finance-domain-tuned LLM and prompt design.
          - Query latency: Graph traversal is inherently slower than vector search or RDB queries. Designed a **Semantic Caching** strategy that pre-generates expected Q&A pairs from FAQs, documents, and the graph, storing them in a separate graph for instant cached responses.

          **AIOps Platform & LLM Serving Optimization**

          Deployed Kubernetes-based servers on EKS/ECR, served static frontend assets via CloudFront, and automated deployment with GitHub Actions. Introduced serving frameworks such as vLLM and TensorRT-LLM internally, and provided LLM serving and endpoints in a closed on-premises environment. Supported stable AI service operations by building an internal data analysis environment and company-wide LLM serving infrastructure.

