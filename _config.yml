about_content: | # this will include new lines to allow paragraphs
  저는 16세에 대학에 입학했습니다. 어릴 때부터 컴퓨터에 깊은 흥미를 느껴 보다 빠르고 주도적인 학습을 위해 중·고등학교 대신 검정고시를 선택했고, 곧바로 대학 입시를 준비해 Beijing Institute of Technology에 입학했습니다.

  대학 입학 후에도 소프트웨어로 문제를 해결하는 과정에 몰두했습니다. IoT, 블록체인, AI 등 안 해본 프로젝트 없이 다양한 공모전과 해커톤에 개발자로 참여하며 폭넓은 스펙트럼의 경험과 문제 정의·해결 역량을 쌓았고, 소프트웨어 마에스트로, KDT, 백엔드 인턴십 등을 통해 이를 더욱 다졌습니다.

  현재는 미래에셋증권 AI솔루션본부에서 금융 도메인 지식그래프와 LLM 서빙 인프라를 기획부터 운영까지 직접 설계·구축하고 있습니다. RDB와 비정형 금융문서(공시, 투자설명서, 리서치)를 통합 Knowledge Graph로 변환하는 Ingestion 파이프라인을 설계·구현했고, PDF 글리프·괘선 좌표 기반 표 복원 알고리즘으로 문서 파싱 정확도를 높였습니다. LLM이 생성한 온톨로지를 법령·공식분류체계 기준으로 검증하는 Self-Reflective 평가 루프를 구축해 수작업 검수 없이도 품질을 보장하고, 자체 구현한 Temporal Graph 엔진으로 시간축 기반 사실 모순까지 탐지할 수 있는 구조를 만들었습니다.

  AIOps 플랫폼에서는 리전 간 failover, 링크 단절 내성, GPU 장애 자동 격리 등 무중단 운영과 prefix cache 라우팅, P/D 분리, KV 관리 등 LLM 서빙 성능을 동시에 고려한 대고객 LLM 서빙 플랫폼을 설계하고, 인증·테넌트 quota·모델 alias·감사·데이터 리전 정책을 담당하는 LLM Gateway를 LiteLLM, Envoy, AIBrix 기반으로 구현했습니다.

  단순히 모델을 서빙하는 것을 넘어, 데이터 파싱부터 온톨로지 설계·검증, 서빙 인프라까지 전 과정을 직접 설계하고 운영하며, 도메인 지식을 이해하고 실행할 수 있는 AI 서비스 파이프라인을 만드는 AI Engineer로 성장하고자 합니다.

about_content_en: | # this will include new lines to allow paragraphs
  Entered university at 16 after completing an accelerated equivalency program in place of middle and high school, allowing me to pursue independent study at a faster pace. I was admitted to Beijing Institute of Technology, where I studied Software Engineering.

  Since then, I have focused on solving problems through software, working as a developer on projects spanning IoT, blockchain, and AI across numerous competitions and hackathons. I developed broad experience in problem framing and problem-solving, further strengthened through Software Maestro, K-Digital Training (KDT), and backend engineering internships.

  Currently, I work as an AI Engineer in the AI Solutions Division at Mirae Asset Securities, where I design and operate financial-domain knowledge graphs and LLM serving infrastructure end to end. I designed and built an ingestion pipeline that converts RDB records and unstructured financial documents — including disclosures, prospectuses, and research reports — into a unified knowledge graph. I developed a table reconstruction method based on glyph coordinates and rule-line geometry to improve PDF parsing accuracy, and implemented a self-evaluation loop that validates LLM-generated ontologies against statutes and official classification systems, minimizing the need for manual review. I also replaced an open-source temporal graph engine with a custom implementation supporting bi-temporal invalidation to detect contradictions between facts over time.

  On the AIOps platform, I designed an LLM serving architecture that balances high availability — including cross-region failover, link-failure tolerance, and automatic GPU fault isolation — with inference performance through prefix-cache routing, prefill/decode disaggregation, and KV-cache management. I also built an LLM Gateway using LiteLLM, Envoy, and AIBrix to handle authentication, tenant quotas, model aliases, audit logging, and data-region policies.

  I focus on owning the full AI infrastructure pipeline — from document parsing, ontology design, and validation to inference and serving infrastructure — with the goal of building AI systems that can reliably understand and act on domain knowledge.

