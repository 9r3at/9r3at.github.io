content_en:
  - title: Experience
    layout: list
    content:
      - layout: left
        title: Mirae Asset Securities
        sub_title: AI Engineer, Data Platform Team, AI Solutions Division
        caption: Jul 2023 - Present
        quote: >
          Designing and building financial-domain knowledge graphs and LLM serving infrastructure end to end, from planning to operations
        description: | # this will include new lines to allow paragraphs
          **Knowledge Graph DB with Ontology**

          Designed and built an ingestion pipeline that converts RDB records and unstructured financial documents (disclosures, prospectuses, research reports) into a unified knowledge graph. Developed a glyph-coordinate-based table reconstruction method to improve PDF table/figure parsing accuracy, and built a self-reflective evaluation loop that validates LLM-generated ontologies (TBox) against statutes and official classification systems, ensuring quality without manual review. Replaced an open-source temporal graph engine with a custom implementation to support bi-temporal invalidation for detecting fact contradictions over time.

          - Built a 5-stage ingestion pipeline (parsing / ontology / ontology_axioms / materialization / indexing) that takes RDB records and unstructured documents (DART disclosures, simplified prospectuses, research, house views) as input and populates a knowledge graph (Neptune) and vector index (OpenSearch)
          - Solved PDF table parsing accuracy issues with an algorithm that cross-validates OCR output against the original PDF's glyph and rule-line coordinates (band detection + DP alignment + VLM patch)
          - Extracted statutes and official classification systems (Capital Markets Act, KRX, DART) via an LLM-independent ETL to serve as guardrails (closed classification, scope ceiling) for the ontology-design LLM, with SHACL validation and automatic classification of breaking changes across versions
          - Introduced an LLM self-evaluation re-extraction loop that automatically improves ontology quality (re-generating with injected feedback below a quality threshold, escalating to human review above it)

          **AIOps Platform & LLM Serving Optimization**

          - A Kubernetes-based platform providing a data analysis environment linked to the CDP (Hadoop) analytics warehouse, along with LLM access
          - Designed a customer-facing LLM serving platform balancing high availability (cross-region failover, link-failure tolerance, automatic GPU fault isolation) with LLM serving performance (prefix cache routing, prefill/decode separation, KV management), and built an LLM Gateway on LiteLLM/Envoy/AIBrix handling authentication, tenant quotas, model aliases, auditing, and data-region policy

