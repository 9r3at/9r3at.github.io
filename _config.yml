about_content: | # this will include new lines to allow paragraphs
  저는 16세에 대학에 입학했습니다. 어릴 때부터 컴퓨터에 깊은 흥미를 느껴 보다 빠르고 주도적인 학습을 위해 중·고등학교 대신 검정고시를 선택했고, 곧바로 대학 입시를 준비해 Beijing Institute of Technology에 입학했습니다.

  대학 입학 후에도 소프트웨어로 문제를 해결하는 과정에 몰두했습니다. 다양한 공모전과 해커톤에 개발자로 참여했고, 소프트웨어 마에스트로, KDT, 백엔드 인턴십 등을 통해 기술로 문제를 정의하고 해결하는 경험을 쌓아왔습니다.

  현재는 미래에셋증권 AI솔루션본부에서 AIOps 플랫폼 및 AI 서비스 파이프라인 개발을 담당하고 있으며, 최근에는 증권사 도메인에 특화된 Knowledge Graph DB 구축을 맡고 있습니다. 증권사 상품, PB 가이드, WM 업무 가이드를 대상으로 온톨로지와 지식 그래프를 설계·구현해, 기존 벡터 검색 기반 RAG로는 대응하기 어려웠던 연관관계 중심 질의와 구조적 질문을 처리할 수 있는 검색 구조를 구축했습니다.

  이 과정에서 정형·비정형 데이터의 파싱과 청킹 전략 수립, 지식 그래프 데이터 추출·적재, 그래프 기반 검색까지 전 과정을 직접 기획·개발하며, 단순 검색을 넘어 Agent가 업무 지식을 실제 업무 프로세스에 활용할 수 있는 기반을 마련했습니다.

  앞으로는 도메인 지식을 이해하고 실행할 수 있는 AI 서비스 파이프라인을 설계·구축하는 AI Engineer로 성장하고자 합니다.

about_content_en: | # this will include new lines to allow paragraphs
  I entered university at 16. Fascinated by computers from an early age, I chose to take an equivalency exam instead of attending middle and high school so I could learn faster and more independently, then prepared directly for university entrance and was admitted to Beijing Institute of Technology.

  Since then, I've stayed focused on solving problems through software. I've worked as a developer in numerous competitions and hackathons, and built experience defining and solving problems with technology through programs such as Software Maestro, KDT (K-Digital Training), and backend internships.

  I currently work at Mirae Asset Securities' AI Solutions Division, developing an AIOps platform and AI service pipelines, and more recently leading the construction of a Knowledge Graph DB tailored to the securities domain. I designed and implemented an ontology and knowledge graph covering securities products, PB (private banking) guides, and WM (wealth management) work guides, building a search architecture that can handle relationship-centric and structural queries that traditional vector-search-based RAG struggles with.

  Throughout this process, I personally planned and built the entire pipeline myself — from parsing and chunking strategies for structured and unstructured data, to extracting and loading knowledge graph data, to graph-based search — laying the groundwork for agents to apply institutional knowledge to real business processes, beyond simple retrieval.

  Going forward, I want to grow as an AI Engineer who designs and builds AI service pipelines that can understand and act on domain knowledge.

