        description: | # this will include new lines to allow paragraphs
          **Knowledge Graph DB with Ontology**

          증권사 상품, PB 가이드, WM 업무 가이드를 대상으로 온톨로지·지식그래프 설계, 정형·비정형 데이터 KG 생성 파이프라인 기획·개발. LLM 기반 비정형 데이터 정보 추출, 문서 유형별 파이프라인 분리 구현. 벡터 검색 기반 RAG의 한계(연관관계·구조적 질의 미대응)를 KG 기반 RAG로 확장해 해결. 사내 업무 프로세스(WM, PB 업무)를 온톨로지로 구현해 Agent가 업무 효율화를 수행할 수 있는 기반 마련.

          - Hallucination 문제: 도메인 이해가 없는 LLM을 비정형 데이터에 적용하며 관계 오류·신뢰도 저하 발생 → VL 모델 기반 임베딩, Reranker 적용, 금융 도메인 특화 LLM·프롬프트 설계로 개선 방향 제시
          - 검색 속도 문제: 그래프 탐색 특성상 벡터 검색·RDB 쿼리 대비 응답 속도 저하 → FAQ·문서·그래프 기반 예상 질의-응답 쌍을 사전 생성해 별도 그래프로 저장하는 **Semantic Caching** 전략 설계

          **AIOps 플랫폼 & LLM 최적화 서빙**

          EKS/ECR 기반 Kubernetes 서버 배포, CloudFront 기반 프론트엔드 정적 배포, GitHub Actions 배포 자동화. vLLM, TensorRT-LLM 등 서빙 프레임워크 사내 도입, 폐쇄 온프레미스 환경 LLM 서빙 및 엔드포인트 제공. 사내 데이터 분석 환경 및 전사 LLM 서빙 인프라 구축으로 안정적인 AI 서비스 운영 지원.

